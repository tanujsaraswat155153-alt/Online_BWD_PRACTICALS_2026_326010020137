<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title><link rel="stylesheet" href="style.css"></head>
  <body>
    <main class="form-card"><h1>Student Registration Form</h1>
      <p>Please complete all required fields.</p>
<form id="registrationForm">
  <label>Full Name<input type="text" name="fullname" required placeholder="Enter your full name"></label>
<label>Email Address<input type="email" name="email" required placeholder="name@example.com"></label>
  <label>Password<input type="password" name="password" minlength="8" required></label>
<fieldset>
  <legend>Gender</legend>
  <label class="choice"><input type="radio" name="gender" value="Male" required> Male</label>
  <label class="choice"><input type="radio" name="gender" value="Female"> Female</label>
  <label class="choice"><input type="radio" name="gender" value="Other"> Other</label></fieldset>
<label>Date of Birth<input type="date" name="dob" required></label>
  <label>City<input type="text" name="city" required></label>
<label>Course<select name="course" required>
  <option value="">Select course</option>
  <option>BCA</option><option>BBA</option>
  <option>B.Com</option>
  <option>MCA</option></select></label>
<fieldset>
  <legend>Hobbies</legend>
  <label class="choice">
    <input type="checkbox" name="hobbies" value="Reading"> Reading</label>
  <label class="choice"><input type="checkbox" name="hobbies" value="Sports"> Sports</label>
  <label class="choice"><input type="checkbox" name="hobbies" value="Coding"> Coding</label>
  <label class="choice"><input type="checkbox" name="hobbies" value="Music"> Music</label></fieldset>
<label>Address<textarea name="address" rows="3" required></textarea></label>
  <button type="submit">Submit</button>
  <button type="reset" class="reset">Reset</button></form><p id="formMessage" aria-live="polite"></p>
    </main><script src="script.js">
          </script>
  </body>
</html>
