<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Eligibility Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="eligibility-card">
    <h1>Student Eligibility Checker</h1>
    <p>Enter the student's age, attendance and marks to check eligibility.</p>
    <form id="eligibilityForm">
      <label for="age">Student Age (years)</label>
      <input id="age" type="number" min="1" max="100" required>
      <label for="attendance">Attendance Percentage</label>
      <input id="attendance" type="number" min="0" max="100" step="0.1" required>
      <label for="marks">Marks Percentage</label>
      <input id="marks" type="number" min="0" max="100" step="0.1" required>
      <button type="submit">Check Eligibility</button>
    </form>
    <p id="result" aria-live="polite">The eligibility result will appear here.</p>
    <p class="note">Sample rule: age 16 or above, attendance at least 75%, and marks at least 40%.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
