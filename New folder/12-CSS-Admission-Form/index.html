<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Admission Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-card">
    <h1>College Admission Form</h1>
    <p class="intro">Please enter your details to apply for admission.</p>
    <form id="admissionForm">
      <div class="form-row">
        <label for="fullname">Full Name</label>
        <input id="fullname" name="fullname" type="text" placeholder="Enter your full name" required>
      </div>
      <div class="form-row">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" required>
      </div>
      <div class="form-row">
        <label for="phone">Mobile Number</label>
        <input id="phone" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
      </div>
      <div class="form-row">
        <label for="dob">Date of Birth</label>
        <input id="dob" name="dob" type="date" required>
      </div>
      <div class="form-row">
        <label for="course">Select Course</label>
        <select id="course" name="course" required>
          <option value="">Choose a course</option><option>BCA</option><option>BBA</option><option>B.Com</option><option>MCA</option>
        </select>
      </div>
      <fieldset>
        <legend>Gender</legend>
        <label class="choice"><input type="radio" name="gender" value="Male" required> Male</label>
        <label class="choice"><input type="radio" name="gender" value="Female"> Female</label>
        <label class="choice"><input type="radio" name="gender" value="Other"> Other</label>
      </fieldset>
      <div class="form-row">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3" required></textarea>
      </div>
      <label class="terms"><input type="checkbox" required> I confirm that the information entered is correct.</label>
      <button type="submit">Submit Application</button>
      <button type="reset" class="reset">Clear Form</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
