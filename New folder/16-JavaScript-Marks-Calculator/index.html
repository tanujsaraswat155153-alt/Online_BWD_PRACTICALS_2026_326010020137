<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <h1>Student Marks Calculator</h1>
    <p>Enter marks for five subjects (each out of 100).</p>
    <form id="marksForm">
      <label>Subject 1 <input type="number" name="subject1" min="0" max="100" required></label>
      <label>Subject 2 <input type="number" name="subject2" min="0" max="100" required></label>
      <label>Subject 3 <input type="number" name="subject3" min="0" max="100" required></label>
      <label>Subject 4 <input type="number" name="subject4" min="0" max="100" required></label>
      <label>Subject 5 <input type="number" name="subject5" min="0" max="100" required></label>
      <button type="submit">Calculate Result</button>
    </form>
    <section id="result" aria-live="polite" hidden>
      <h2>Result</h2><p id="total"></p><p id="percentage"></p><p id="grade"></p><p id="status"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
